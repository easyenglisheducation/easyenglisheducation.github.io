
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Financial Literacy Lab | Money Phrasal Verbs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { 
            --primary: #00cec9; 
            --success: #00b894; 
            --danger: #ff7675; 
            --warning: #fdcb6e; 
            --bg: #0f2334; 
            --card-bg: rgba(10, 31, 48, 0.95);
            --accent: #e67e22; 
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #091724, #0f354a, #00cec9); 
            color: #ecf0f1; 
            text-align: center; 
            margin: 0; 
            min-height: 100vh; 
            padding-bottom: 80px; 
        }
        .container { max-width: 900px; margin: auto; padding: 40px 20px; }
        h1 { color: var(--warning); text-shadow: 2px 2px #000; font-size: 2.2rem; margin-bottom: 5px; }
        .branding { color: var(--primary); font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .sub-branding { color: #a4b0be; font-size: 0.95rem; margin-bottom: 25px; font-style: italic; }
        .card { 
            background: var(--card-bg); 
            padding: 30px; 
            margin: 20px 0; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            border: 2px solid var(--primary); 
        }
        .results-box { 
            background: #040d14; 
            border-left: 6px solid var(--accent); 
            padding: 25px; 
            margin: 20px 0; 
            border-radius: 12px; 
            text-align: left; 
            display: none; 
        }
        .syntax-error { color: var(--danger); font-weight: bold; }
        .correct-word { color: var(--success); font-weight: bold; }
        .partial-word { color: var(--warning); font-style: italic; border-bottom: 1px dashed var(--warning); }
        .remedial-tip { 
            margin-top: 15px; 
            padding: 12px; 
            background: rgba(230, 126, 34, 0.15); 
            border-radius: 8px; 
            border: 1px solid var(--accent);
            color: #fff;
        }
        select, button { 
            padding: 14px 28px; border-radius: 10px; margin: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; 
            font-size: 1rem;
        }
        button { background: var(--primary); color: #2c3e50; }
        button:hover { filter: brightness(1.1); }
        .btn-record { background: var(--danger); color: white; }
        .btn-record.recording { background: #d63031; animation: pulse 1.5s infinite; }
        .btn-next { background: var(--success); color: white; display: none; }
        .option { 
            display: block; width: 100%; margin: 12px 0; padding: 18px; background: #0f354a; border-radius: 12px; cursor: pointer; text-align: left; border: 2px solid transparent; color: white; box-sizing: border-box; font-size: 1.05rem;
        }
        .option:hover { border-color: var(--warning); background: #13445e; }
        .correct { background: var(--success) !important; border-color: #fff; }
        .wrong { background: var(--danger) !important; }
        footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #040d14; color: #747d8c; padding: 12px 0; font-size: 0.9rem; border-top: 1px solid #13445e; letter-spacing: 1px;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(214, 48, 49, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(214, 48, 49, 0); } 100% { box-shadow: 0 0 0 0px rgba(214, 48, 49, 0); } }
    </style>
</head>
<body>

<div class="container">    
    <h1>Financial Literacy Lab</h1>    
    <div class="branding">By Coach Carlos O</div>    
    <div class="sub-branding">Practice Everyday Phrasal Verbs About Money</div>
    
    <div id="setup">        
        <div class="card">            
            <h3 style="color: var(--primary);">Select Your Practice Challenge:</h3>            
            <select id="levelSelect" style="width: 100%; max-width: 400px; background: #0f354a; color: white; border: 1px solid var(--primary);">                
                <option value="B1">Level 1: Basic Money Phrases</option>                
                <option value="B2">Level 2: Paying Debts & Spending</option>                
                <option value="C1">Level 3: Understanding Money Situations</option>            
            </select><br>            
            <button onclick="startQuiz()" style="width: 100%; max-width: 400px; margin-top: 20px;">Start Exercise</button>        
        </div>    
    </div>    
    
    <div id="quiz-area" style="display:none;">        
        <div id="progress" style="margin-bottom:15px; color:var(--warning); font-weight:bold; letter-spacing: 1px;"></div>        
        <div id="quiz"></div>                
        
        <div id="resultsBox" class="results-box">            
            <h4 style="color:var(--primary); margin-top:0;">Speech Feedback:</h4>            
            <div id="visualFeedback" style="font-size: 1.2rem; line-height: 1.7; margin-bottom: 10px;"></div>            
            <div id="evaluationText" style="font-weight: bold; color: var(--warning); margin-bottom: 10px;"></div>            
            <div id="remedialBox"></div>        
        </div>        
        
        <div class="action-buttons">            
            <button onclick="narrateCurrent()" style="background:var(--warning); color: #2c3e50;">🔊 Hear Example</button>            
            <button id="recordBtn" class="btn-record" onclick="toggleRecording()">🎤 Practice Speaking</button>            
            <button id="nextBtn" class="btn-next" onclick="nextQuestion()">Next Question ➜</button>        
        </div>    
    </div>
</div>

<footer>
    © Designed for English Learners By Coach Carlos O
</footer>

<script>
const synth = window.speechSynthesis;
let usVoice = null;

function loadNativeVoice() {    
    const voices = synth.getVoices();    
    usVoice = voices.find(v => v.lang === 'en-US' && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')))               
              || voices.find(v => v.lang === 'en-US');
}
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadNativeVoice;
}
loadNativeVoice();

function speak(text) {    
    synth.cancel();    
    const msg = new SpeechSynthesisUtterance(text);    
    if (usVoice) msg.voice = usVoice;    
    msg.rate = 0.85; 
    synth.speak(msg);
}

function getSimilarity(s1, s2) {    
    let longer = s1.length < s2.length ? s2 : s1;    
    let shorter = s1.length < s2.length ? s1 : s2;    
    if (longer.length == 0) return 1.0;    
    const distance = editDistance(longer, shorter);    
    return (longer.length - distance) / parseFloat(longer.length);
}

function editDistance(s1, s2) {    
    s1 = s1.toLowerCase(); s2 = s2.toLowerCase();    
    let costs = new Array();    
    for (let i = 0; i <= s1.length; i++) {        
        let lastValue = i;        
        for (let j = 0; j <= s2.length; j++) {            
            if (i == 0) costs[j] = j;            
            else {                
                if (j > 0) {                    
                    let newValue = costs[j - 1];                    
                    if (s1.charAt(i - 1) != s2.charAt(j - 1))                        
                        newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;                    
                    costs[j - 1] = lastValue;                    
                    lastValue = newValue;                
                }            
            }        
        }        
        if (i > 0) costs[s2.length] = lastValue;    
    }    
    return costs[s2.length];
}

const questions = {    
    B1: [        
        {
            q:"Practice the phrase for when friends give money together to buy a gift: 'Chip in'", 
            a:"chip in", 
            narrate: "Friends often chip in to buy a nice gift for a coworker who is leaving the company.",
            o: ["chip in", "shell out", "scrape by", "pay off"]
        },        
        {
            q:"Practice the phrase for when you have no money left: 'Run out of money'", 
            a:"run out of money", 
            narrate: "New businesses often run out of money before they can become successful.",
            o: ["run out of money", "fork out for repairs", "pay off loans", "scrape by cleanly"]
        },        
        {
            q:"Practice the phrase for when you unexpectedly have to pay for something expensive: 'Fork out for'", 
            a:"fork out for", 
            narrate: "Sometimes you have to fork out for car repairs when you don't expect it.",
            o: ["fork out for", "chip in toward", "pay off entirely", "run out of"]
        }    
    ],    
    B2: [        
        {
            q:"To have good finances, you should always try to ___ your old loans and credit card debts.", 
            a:"pay off", 
            narrate: "To have good finances, you should always try to pay off your old loans and credit card debts.",
            o: ["pay off", "scrape by", "shell out", "chip in"]
        },        
        {
            q:"When flights are cancelled or delayed, travelers often have to ___ extra money for a new ticket.", 
            a:"shell out", 
            narrate: "When flights are cancelled or delayed, travelers often have to shell out extra money for a new ticket.",
            o: ["shell out", "run out of", "pay off", "scrape by"]
        },        
        {
            q:"When the economy is bad, families with low incomes struggle just to ___ on a small salary.", 
            a:"scrape by", 
            narrate: "When the economy is bad, families with low incomes struggle just to scrape by on a small salary.",
            o: ["scrape by", "fork out for", "run out of", "chip in"]
        }    
    ],    
    C1: [        
        {
            q:"What happens when people are forced to 'shell out' a lot of money for basic things?", 
            a:"When people shell out too much for basics, they cannot buy other things they want.", 
            narrate: "When people shell out too much for basics, they cannot buy other things they want.",
            o: ["When people shell out too much for basics, they cannot buy other things they want.", "They like to chip in with their neighbors to build better houses.", "When families pay off their debts, supermarkets become more expensive.", "If they run out of money, small businesses will become more popular."]
        },        
        {
            q:"What does it mean when a family is only managing to 'scrape by'?", 
            a:"It means they barely have enough money to live, so they cannot save or invest.", 
            narrate: "It means they barely have enough money to live, so they cannot save or invest.",
            o: ["It means they barely have enough money to live, so they cannot save or invest.", "It means they have enough money to fork out for expensive vacations.", "It means they are working very hard to pay off their international loans.", "It means they never run out of money when they go to the supermarket."]
        },        
        {
            q:"What happens when someone finally manages to 'pay off' all their debt?", 
            a:"When they pay off their loans, they finally have extra money to save or spend.", 
            narrate: "When they pay off their loans, they finally have extra money to save or spend.",
            o: ["When they pay off their loans, they finally have extra money to save or spend.", "They are no longer allowed to chip in for fun activities.", "They immediately run out of money because they paid the bank.", "They have to shell out a lot of money for their everyday food."]
        }
    ]
};

let currentIdx = 0, levelData = [], currentLevel = "B1", recognition;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => processNeuralFeedback(e.results[0][0].transcript);    
    recognition.onend = () => document.getElementById('recordBtn').classList.remove('recording');
}

function startQuiz() {    
    currentLevel = document.getElementById('levelSelect').value;    
    levelData = questions[currentLevel];    
    currentIdx = 0;    
    document.getElementById('setup').style.display = 'none';    
    document.getElementById('quiz-area').style.display = 'block';    
    loadQuestion();
}

function loadQuestion() {    
    const data = levelData[currentIdx];    
    document.getElementById('progress').innerText = `EXERCISE PROGRESS: ${currentIdx + 1} / ${levelData.length}`;    
    document.getElementById('quiz').innerHTML = `<div class="card"><h2 style="font-size: 1.3rem; line-height: 1.6;">${data.q}</h2></div>`;    
    document.getElementById('resultsBox').style.display = 'none';    
    document.getElementById('nextBtn').style.display = 'none';    
    
    const options = [...data.o].sort(() => Math.random() - 0.5);
    options.forEach(opt => {        
        const div = document.createElement('div');        
        div.className = 'option';        
        div.textContent = opt;        
        div.onclick = function() {            
            if(this.textContent.toLowerCase() === data.a.toLowerCase() || this.textContent.startsWith(data.a)) {                
                document.querySelectorAll('.option').forEach(o => o.classList.remove('correct', 'wrong'));                
                this.classList.add('correct');                
                speak(data.narrate);             
                document.getElementById('nextBtn').style.display = 'inline-block';            
            } else { this.classList.add('wrong'); }        
        };        
        document.querySelector('#quiz .card').appendChild(div);    
    });
}

function toggleRecording() {    
    if (recognition) { 
        try {
            recognition.start(); 
            document.getElementById('recordBtn').classList.add('recording'); 
        } catch(e) {
            recognition.stop();
        }
    } else {
        alert("The microphone tool is not available in this browser window.");
    }
}

function processNeuralFeedback(transcript) {    
    const data = levelData[currentIdx];
    const target = data.a;    
    const spoken = transcript.toLowerCase().trim().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");    
    const cleanTarget = target.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
    const cleanNarrate = data.narrate.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
    
    let performanceScore = 0;
    
    if (spoken === cleanTarget || spoken.includes(cleanTarget) || spoken === cleanNarrate || cleanNarrate.includes(spoken)) {
        performanceScore = 100;
    } else {
        let similarity = getSimilarity(cleanTarget, spoken);
        performanceScore = Math.round(similarity * 100);
    }
    
    const passThreshold = 60; 

    document.getElementById('resultsBox').style.display = 'block';    
    const visual = document.getElementById('visualFeedback');    
    const evalText = document.getElementById('evaluationText');    
    const remedial = document.getElementById('remedialBox');    

    if (performanceScore >= 90) {        
        visual.innerHTML = `You said: "<span class=\"correct-word\">${transcript}</span>"<br>Target Phrase: <strong>${target}</strong> (Excellent pronunciation!)`;    
    } else if (performanceScore >= passThreshold) {        
        visual.innerHTML = `You said: "<span class=\"partial-word\">${transcript}</span>"<br>Target Phrase: <strong>${target}</strong> (Good effort! Keep practicing.)`;        
        performanceScore = Math.max(performanceScore, 85);   
    } else {        
        visual.innerHTML = `You said: "<span class=\"syntax-error\">${transcript}</span>"<br>Target Phrase: <strong>${target}</strong> (Speak a bit slower and try again!)`;    
    }    

    evalText.innerText = `Pronunciation Score: ${performanceScore}%`;    
    remedial.innerHTML = "";    
    
    if (performanceScore >= passThreshold) {
        const tip = document.createElement('div');        
        tip.className = 'remedial-tip';        
        tip.innerHTML = "<strong>Coach Carlos O:</strong> Great job! You spoke clearly and naturally.";        
        remedial.appendChild(tip);        
        document.getElementById('nextBtn').style.display = 'inline-block';    
    } else {
        const tip = document.createElement('div');        
        tip.className = 'remedial-tip';        
        tip.innerHTML = "<strong>Coach Carlos O:</strong> Don't pause between the words. Say 'fork out for' or 'run out of' as one smooth phrase.";        
        remedial.appendChild(tip);  
    }
}

function nextQuestion() {    
    currentIdx++;    
    if (currentIdx < levelData.length) loadQuestion();    
    else document.getElementById('quiz-area').innerHTML = "<h1 style='color: var(--success);'>Conversation Exercise Complete!</h1><p style='font-size:1.2rem;'>Great work! You are getting much better at using English phrasal verbs related to money.</p><button onclick='location.reload()'>Restart Exercise</button>";
}

function narrateCurrent() { if (levelData[currentIdx]) speak(levelData[currentIdx].narrate); }
</script>
</body>
</html>
